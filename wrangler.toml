name = "cadence-listy"
main = ".svelte-kit/cloudflare/_worker.js"
compatibility_date = "2026-06-01"
compatibility_flags = ["nodejs_als"]

[assets]
binding = "ASSETS"
directory = ".svelte-kit/cloudflare"

[[d1_databases]]
binding = "DB"
database_name = "cadence-listy"
database_id = "f637960d-f8d0-4760-9b09-6c0d8238df6c"

[[r2_buckets]]
binding = "IMAGES"
bucket_name = "cadence-listy-images"

# Once a day: delete finished lists and clear out old sign-ins.
[triggers]
crons = ["17 8 * * *"]
